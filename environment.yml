name: biomero-converter-env
channels:
 - conda-forge
 - defaults
dependencies:
 - python==3.12
 - numpy
 - ome-zarr>=v0.16.0,<0.18  # 0.18+ loses metadata in our writer, see notes/todo_known_issues.md
