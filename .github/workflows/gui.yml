name: GUI tests

# Runs the unit tests (GUI and converter; the integration tests that need local test data
# are deselected by default) on Windows, macOS and Linux (the GUI is meant to work on all three).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # version from git tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]"

      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a python -m pytest -v

      - name: Test
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: python -m pytest -v
