name: GUI tests

# Runs the desktop GUI tests and the converter tests that need no local test data,
# on Windows, macOS and Linux (the GUI is meant to work on all three).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # version from git tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]"

      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a python -m pytest test/test_gui.py test/test_convert.py -k "gui or default_output_format or retry" -v -o faulthandler_timeout=60

      - name: Test
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: python -m pytest test/test_gui.py test/test_convert.py -k "gui or default_output_format or retry" -v -o faulthandler_timeout=60
